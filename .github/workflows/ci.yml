# Intégration continue de Meridien. Les noms des jobs (champ `name`) sont stables : ce sont eux que la protection de
# `main` doit rendre obligatoires (liste et explications dans docs/outils.md).
#
# Chaque action est épinglée par le SHA du commit de son tag (lu dans son dépôt, tag en commentaire), les outils
# installés par pip ou téléchargés le sont à la version exacte utilisée sur le PC d'Axel. Ceux de pip (ruff, clang-format,
# playwright) le sont en plus par l'empreinte SHA-256 de chaque fichier, dépendances comprises : .github/exigences/*.txt, installés
# avec « pip install --require-hashes » (un paquet changé sur PyPI, ou une dépendance non listée, fait échouer l'installation).
#
# Dépôt public depuis le 08/11/2026 (privé avant : minutes facturables). Les jobs lourds ne tournent que quand il le faut :
#   - pull_request : tests-noyau (verdict de changements + noyau-clang + noyau-gpp), ruff, clang-format, gitleaks, firmware-tab5,
#     firmware-waveshare-7b ;
#   - push sur main et lancement manuel : en plus parcours-web (réseau) ;
#   - lancement manuel seulement : mutations-noyau (très longue, voir plus bas).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  # Faut-il compiler les tests C++ du noyau ? Non quand la pull request ne touche rien de ce que ces tests lisent : ni un test,
  # ni un en-tête qu'un test inclut (directement ou non, y compris dans main/), ni un dossier d'inclusion. La liste est calculée
  # par le préprocesseur (test/host/lancer.py --concerne), jamais écrite à la main, donc elle suit les nouveaux #include.
  # Les contrôles Python qui recoupent le noyau avec main/, web/, boards/ et docs/ (traduction, contrat de l'API, cartes, mer)
  # tournent TOUJOURS, tests C++ sautés ou non. Tout doute répond « oui » : push sur main, lancement manuel, ci.yml modifié,
  # fusion illisible, lanceur en erreur.
  changements:
    name: changements
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.verdict.outputs.cpp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # la fusion de la pull request et ses deux parents : HEAD^1 = main, HEAD^2 = la branche
          persist-credentials: false
      - name: Les tests C++ du noyau sont-ils concernés ?
        id: verdict
        run: |
          cpp=true
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            raison="événement ${GITHUB_EVENT_NAME} : tout tourne"
          elif ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            raison="HEAD n'est pas la fusion de la pull request : par prudence tout tourne"
          elif ! git diff --name-only --no-renames 'HEAD^1' HEAD > modifies.txt; then
            raison="liste des fichiers modifiés illisible : par prudence tout tourne"
          elif grep -qx '.github/workflows/ci.yml' modifies.txt; then
            raison="ci.yml modifié : tout tourne"
          else
            echo "$(wc -l < modifies.txt) fichier(s) modifié(s) par la pull request :"
            cat modifies.txt
            verdict=$(python3 test/host/lancer.py --concerne modifies.txt --cxx "$(command -v g++)") || verdict="oui : le lanceur a échoué"
            raison="${verdict}"
            case "${verdict}" in non*) cpp=false ;; esac
          fi
          echo "cpp=${cpp} : ${raison}"
          echo "cpp=${cpp}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Tests C++ du noyau : $([ "${cpp}" = true ] && echo lancés || echo sautés)"
            echo
            echo "${raison}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Le noyau pur (components/core) compilé ET exécuté sous Linux, avec les détecteurs d'erreurs mémoire (AddressSanitizer)
  # et de comportements indéfinis (UBSan), par deux compilateurs de l'image du runner, dans DEUX jobs qui partent en même
  # temps (chacun sur son runner de 4 cœurs, quatre fichiers de test à la fois : lancer.py --jobs 4) :
  #   - noyau-clang : clang++-18 avec ASan + UBSan complets (mêmes options que clang++-san.cmd sur le PC d'Axel) ;
  #   - noyau-gpp : g++-14 avec ASan seul. Essai du 06/11/2026 : g++ 14.2 avec -fsanitize=undefined ne sait plus évaluer les
  #     static_assert des tests (« is not a constant expression », fuseaux.hpp:49), tant que null, bounds, pointer-overflow,
  #     nonnull-attribute, returns-nonnull-attribute et vptr sont actifs ; en retirer un seul ne suffit pas. Sans UBSan, g++
  #     compile et exécute tous les tests. Le détecteur de fuites est coupé, comme sur le PC (non pris en charge sous Windows).
  # Mesuré le 09/11/2026 : un fichier après l'autre, clang 13 à 25 min et g++ 3 à 5 min, l'un derrière l'autre (voir docs/outils.md).
  noyau-clang:
    name: noyau-clang
    needs: changements
    if: needs.changements.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compilateur avec détecteurs
        run: |
          echo "cœurs : $(nproc), mémoire : $(free -m | awk '/^Mem:/ {print $2}') Mo"
          clang++-18 --version | head -n 1
          sudo tee /usr/local/bin/clang++-san > /dev/null <<'EOT'
          #!/bin/sh
          exec clang++-18 -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer "$@"
          EOT
          sudo chmod +x /usr/local/bin/clang++-san
      - name: Tests du noyau, clang++-18 avec ASan et UBSan
        run: |
          set -o pipefail
          python test/host/lancer.py --cxx /usr/local/bin/clang++-san --jobs 4 --durees | tee noyau-clang.log
          # Le lanceur retombe en « syntaxe » (rien d'exécuté) sans bon compilateur : on exige le mode complet.
          grep -q 'mode        : complet' noyau-clang.log
          # Chaque fichier de test écrit « N test(s), M echec(s) » : la somme prouve que tout a été exécuté.
          total=$(grep -oE '^[0-9]+ test\(s\)' noyau-clang.log | awk '{s += $1} END {print s + 0}')
          echo "tests exécutés (clang++-18) : ${total} dans $(grep -c '^test_.*\.cpp :$' noyau-clang.log) fichiers"
          test "${total}" -gt 0

  noyau-gpp:
    name: noyau-gpp
    needs: changements
    if: needs.changements.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compilateur avec détecteur
        run: |
          echo "cœurs : $(nproc), mémoire : $(free -m | awk '/^Mem:/ {print $2}') Mo"
          g++-14 --version | head -n 1
          sudo tee /usr/local/bin/g++-san > /dev/null <<'EOT'
          #!/bin/sh
          exec g++-14 -fsanitize=address -fno-omit-frame-pointer "$@"
          EOT
          sudo chmod +x /usr/local/bin/g++-san
      - name: Tests du noyau, g++-14 avec ASan
        run: |
          set -o pipefail
          python test/host/lancer.py --cxx /usr/local/bin/g++-san --jobs 4 --durees | tee noyau-gpp.log
          grep -q 'mode        : complet' noyau-gpp.log
          total=$(grep -oE '^[0-9]+ test\(s\)' noyau-gpp.log | awk '{s += $1} END {print s + 0}')
          echo "tests exécutés (g++-14) : ${total} dans $(grep -c '^test_.*\.cpp :$' noyau-gpp.log) fichiers"
          test "${total}" -gt 0

  # Le contrôle REQUIS de la protection de `main` : son nom ne change pas, il tourne TOUJOURS (il n'est jamais « skipped »)
  # et rend le verdict de ce qui devait tourner. `!cancelled()` plutôt que `success()` : il doit s'exécuter, et ÉCHOUER,
  # quand `changements` ou un des deux compilateurs a échoué. Un job « skipped » compte pour réussi aux yeux de GitHub : ici
  # « skipped » n'est accepté que pour les deux compilateurs, et seulement quand `changements` a répondu « false ».
  tests-noyau:
    name: tests-noyau
    needs: [changements, noyau-clang, noyau-gpp]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changements.outputs.cpp == 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changements.outputs.cpp == 'false'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Contrôles croisés seuls (aucun test C++ concerné)
        if: needs.changements.outputs.cpp == 'false'
        run: |
          set -o pipefail
          python test/host/lancer.py --controles-seuls --durees | tee controles.log
          grep -q 'mode        : contrôles seuls' controles.log
          grep -q 'RÉSULTAT : tout passe' controles.log
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          CHANGEMENTS: ${{ needs.changements.result }}
          CPP: ${{ needs.changements.outputs.cpp }}
          CLANG: ${{ needs.noyau-clang.result }}
          GPP: ${{ needs.noyau-gpp.result }}
        run: |
          echo "changements : ${CHANGEMENTS} (cpp=${CPP})"
          echo "noyau-clang : ${CLANG}"
          echo "noyau-gpp   : ${GPP}"
          test "${CHANGEMENTS}" = success
          if [ "${CPP}" = true ]; then
            test "${CLANG}" = success && test "${GPP}" = success
          elif [ "${CPP}" = false ]; then
            test "${CLANG}" = skipped && test "${GPP}" = skipped
          else
            echo "changements n'a rien répondu de clair : échec par prudence"
            exit 1
          fi

  # Chaque mutation du noyau doit faire échouer le test qui la vise. Compilation seule : pas besoin des détecteurs.
  # clang++-18 comme sur le PC d'Axel, où toutes les mutations sont détectées. Attention : la liste en compte 1 530
  # (206 le 06/11/2026) et le lancement du 08/11/2026 a atteint la limite de 150 minutes sans finir (docs/outils.md).
  # Retiré des push le 08/11/2026 sur la parole d'Axel : il ne part plus qu'à la main (workflow_dispatch).
  mutations-noyau:
    name: mutations-noyau
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Mutations du noyau
        run: |
          clang++-18 --version | head -n 1
          python test/host/lancer.py --mutations --cxx "$(command -v clang++-18)"

  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff (configuration dans ruff.toml)
        run: |
          python -m pip install --require-hashes -r .github/exigences/ruff.txt
          ruff --version
          git ls-files '*.py' | xargs ruff check --no-cache

  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: clang-format (règle dans .clang-format, exclusions dans .clang-format-ignore)
        run: |
          python -m pip install --require-hashes -r .github/exigences/clang-format.txt
          clang-format --version
          git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.inc' > fichiers.txt
          echo "$(wc -l < fichiers.txt) fichier(s) C/C++ suivis (les fichiers générés sont ignorés par clang-format)"
          xargs clang-format --style=file --dry-run -Werror < fichiers.txt

  # Recherche de secrets dans tout l'historique. CLI épinglée plutôt que gitleaks-action : l'action est gratuite pour un
  # compte personnel mais demande une clé de licence dès que le dépôt appartient à une organisation (README de l'action).
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (archive vérifiée par SHA-256)
        run: |
          # Relances : le 09/11/2026 l'archive a échoué trois fois sur un 504 de GitHub, et un job ne se relance qu'une fois
          # TOUT le run terminé (donc après la fin des tests du noyau, quand ils étaient lancés un fichier après l'autre).
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check -
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" version
      - name: Rechercher des secrets dans l'historique
        run: |
          git log --oneline | wc -l
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner

  # Parcours de la page de réglages (web/) dans Chromium contre le faux appareil. Demande Internet : la recherche de lieu
  # et la météo appellent vraiment Open-Meteo. Informatif (une panne du service ferait échouer le job) : à ne pas rendre
  # obligatoire, d'où son absence des pull requests.
  parcours-web:
    name: parcours-web
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Parcours Playwright
        run: |
          python -m pip install --require-hashes -r .github/exigences/playwright.txt
          python -m playwright install --with-deps chromium
          node --version
          python web/tests/parcours.py

  # Compile VRAIMENT le projet : conteneur officiel espressif/idf (ESP-IDF 5.5.5, image figée par son empreinte), sdkconfig
  # neuf, composants gérés téléchargés selon dependencies.lock. Ne prouve ni l'affichage ni le tactile : rien n'est flashé.
  # La Waveshare 7B a son job juste après (firmware-waveshare-7b).
  firmware-tab5:
    name: firmware-tab5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compiler le Tab5 (ESP-IDF 5.5.5, esp32p4)
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
          target: esp32p4
          command: idf.py set-target esp32p4 && idf.py build && idf.py size
      - name: Preuves que le projet a été compilé
        run: |
          set -eu
          echo "--- binaire"
          ls -l build/meridien.bin
          sha256sum build/meridien.bin
          test ! -e build/ecran_autonome.bin
          echo "--- description du projet"
          python3 - <<'EOF'
          import json
          d = json.load(open("build/project_description.json"))
          print({k: d[k] for k in ("project_name", "target", "idf_ver", "build_dir") if k in d})
          assert d["project_name"] == "meridien" and d["target"] == "esp32p4", d["project_name"]
          EOF
          echo "--- composants gérés téléchargés"
          ls managed_components
          test -d managed_components/lvgl__lvgl
          echo "--- dependencies.lock inchangé par la compilation"
          git diff --exit-code -- dependencies.lock

  # Même compilation pour la Waveshare 7B (-DBOARD=waveshare-7b, ADR-0005) : même image ESP-IDF, sdkconfig neuf, composants
  # gérés selon boards/waveshare-7b/dependencies.lock. Vérifie aussi que le sdkconfig produit est bien celui de la 7B (flash
  # 32 Mo, remise à zéro du C6 par GPIO54) et qu'il porte les réglages communs de mémoire interne (sdkconfig.defaults).
  # Ne prouve rien sur la carte : rien n'est flashé.
  firmware-waveshare-7b:
    name: firmware-waveshare-7b
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compiler la Waveshare 7B (ESP-IDF 5.5.5, esp32p4)
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
          target: esp32p4
          command: idf.py -DBOARD=waveshare-7b set-target esp32p4 && idf.py -DBOARD=waveshare-7b build && idf.py -DBOARD=waveshare-7b size
      - name: Preuves que le projet a été compilé
        run: |
          set -eu
          echo "--- binaire"
          ls -l build/meridien.bin
          sha256sum build/meridien.bin
          test ! -e build/ecran_autonome.bin
          echo "--- description du projet"
          python3 - <<'EOF'
          import json
          d = json.load(open("build/project_description.json"))
          print({k: d[k] for k in ("project_name", "target", "idf_ver", "build_dir") if k in d})
          assert d["project_name"] == "meridien" and d["target"] == "esp32p4", d["project_name"]
          composants = d.get("build_components", [])
          assert "bsp_waveshare_7b" in composants and "bsp_tab5" not in composants, composants
          print("couche carte : bsp_waveshare_7b")
          EOF
          echo "--- sdkconfig de la 7B et réglages communs de mémoire interne"
          grep -E '^CONFIG_(ESPTOOLPY_FLASHSIZE_32MB|ESP_HOSTED_SDIO_GPIO_RESET_SLAVE|SPIRAM_MALLOC_ALWAYSINTERNAL|MBEDTLS_EXTERNAL_MEM_ALLOC)=' sdkconfig
          grep -qx 'CONFIG_ESPTOOLPY_FLASHSIZE_32MB=y' sdkconfig
          grep -qx 'CONFIG_ESP_HOSTED_SDIO_GPIO_RESET_SLAVE=54' sdkconfig
          grep -qx 'CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256' sdkconfig
          grep -qx 'CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y' sdkconfig
          echo "--- composants gérés téléchargés"
          ls managed_components
          test -d managed_components/lvgl__lvgl
          echo "--- verrous de dépendances inchangés par la compilation"
          git diff --exit-code -- boards/waveshare-7b/dependencies.lock dependencies.lock
