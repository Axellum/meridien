# ============================================================================
# i18n/page.yaml — catalogue des textes de la page de réglages (web/app/app.js).
# Chaque ligne associe un IDENTIFIANT stable (ce que app.js écrit : t('ville.titre')) au texte FRANÇAIS, qui est la clé
# dans i18n/<code>.yaml. app.js ne contient donc aucun texte français. components/core/outils/generer_i18n.py en tire
# web/app/lang/<code>.json (fichiers chargés à la demande par la page). Un identifiant ne change jamais de sens ;
# <NBSP> = espace insécable (U+00A0) écrite telle quelle dans le texte.
# ============================================================================

