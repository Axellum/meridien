# Contrôle Python du projet, autonome : sans ce fichier ruff héritait d'une configuration plus stricte trouvée
# plus haut dans l'arborescence du PC de l'auteur (règles de sécurité et de style d'un autre dépôt).
line-length = 120
target-version = "py313"

[lint]
# E4/E7/E9 + F : erreurs réelles ; B : pièges courants. Pas de règles de pur style (UP) qui bloqueraient un commit
# pour une écriture « % » au lieu de f-string. B905 (zip sans strict=) écartée : les longueurs sont contrôlées avant.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]
