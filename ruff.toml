# Contrôle Python du projet, autonome : sans ce fichier ruff héritait d'une configuration plus stricte trouvée
# plus haut dans l'arborescence de H:\AuxFilsDesIdees (règles de sécurité et de style du dépôt Tab5).
line-length = 120
target-version = "py313"

[lint]
# E4/E7/E9 + F : erreurs réelles ; B : pièges courants ; UP : syntaxe périmée.
select = ["E4", "E7", "E9", "F", "B", "UP"]
