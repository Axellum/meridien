# ============================================================================
# i18n/tr.yaml — traduction turque de l'écran, de la page de réglages et des messages de l'appareil.
# Le texte FRANÇAIS du code est la clé (façon gettext, comme sur le Tab5) : "texte français": "traduction".
# Format : mapping plat ; une ligne = `"clé": "valeur"` en guillemets doubles (seuls échappements permis : antislash-guillemet et double antislash) ;
# les lignes `_nom: valeur` du début sont des métadonnées ; une ligne `# --- Titre ---` ouvre une section (celles dont
# le titre commence par « Écran » sont ce que l'écran affiche : elles sont contrôlées contre la police embarquée).
# Mêmes clés, même ordre, mêmes sections dans tous les fichiers. Marqueurs (%d %s %u, {noms}) à garder dans le même ordre.
# Tutoiement partout, comme sur le Tab5. Traduction écrite par une IA (Claude) depuis le français et l'anglais ; les dates
# et quelques libellés sont repris tels quels de Tab5/lang/tr.yaml. Seul le français est relu par l'auteur :
# cette langue ne l'est PAS. Détail : i18n/README.md et docs/decisions/0006-ecran-en-sept-langues.md.
# ============================================================================
_langue: Türkçe
_code: tr
_index: 6
_statut: complet   # toutes les clés sont traduites (vérifié par components/core/outils/generer_i18n.py)


